services:
  postgres:
    image: postgres:16-alpine
    container_name: pdf-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdf_processing}
      POSTGRES_USER: ${POSTGRES_USER:-pdf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdf_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdf_user} -d ${POSTGRES_DB:-pdf_processing}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: pdf-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pdf_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pdf_password}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    container_name: pdf-api-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-pdf_processing};Username=${POSTGRES_USER:-pdf_user};Password=${POSTGRES_PASSWORD:-pdf_password}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-pdf_user}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-pdf_password}
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - shared_storage:/app/storage

  worker:
    build:
      context: .
      dockerfile: src/Worker/Dockerfile
    container_name: pdf-worker
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-pdf_processing};Username=${POSTGRES_USER:-pdf_user};Password=${POSTGRES_PASSWORD:-pdf_password}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-pdf_user}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-pdf_password}
      Azure__DocumentIntelligence__Endpoint: ${AZURE_OCR_ENDPOINT:-}
      Azure__DocumentIntelligence__ApiKey: ${AZURE_OCR_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - shared_storage:/app/storage

volumes:
  postgres_data:
  shared_storage: